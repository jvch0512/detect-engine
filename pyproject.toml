[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "detect-engine"
version = "0.1.0"
description = "Lightweight Sigma-style detection engine with MITRE ATT&CK mapping and Navigator export"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
detect-engine = "detect_engine.cli:main"

[tool.setuptools]
packages = ["detect_engine"]
